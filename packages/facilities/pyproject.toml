[project]
name = "droneops-facilities"
version = "0.1.0"
description = "DroneOps pads, chargers and crew windows"
requires-python = ">=3.12,<3.14"
dependencies = [
  "droneops-contracts",
  "droneops-core-domain",
  "droneops-geom-core",
  "droneops-platform",
]

[build-system]
requires = ["uv_build>=0.11,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "droneops_facilities"

[tool.uv.sources]
droneops-contracts = { workspace = true }
droneops-core-domain = { workspace = true }
droneops-geom-core = { workspace = true }
droneops-platform = { workspace = true }
