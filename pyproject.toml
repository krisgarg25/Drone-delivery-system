[project]
name = "droneops-workspace"
version = "0.1.0"
description = "Drone delivery operator platform: Phase 0 simulation-only monorepo"
requires-python = ">=3.12,<3.14"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "mypy>=1.13",
  "ruff>=0.8",
  "hypothesis>=6.115",
  "schemathesis>=3.36",
  "pre-commit>=4.0",
  "import-linter>=2.0",
  "httpx>=0.28",
  "playwright>=1.48",
  "pip-audit>=2.7",
  "cyclonedx-bom>=4.5",
  "pip-licenses>=4.5",
  "uvicorn[standard]>=0.32",
  "pytest-timeout>=2.3",
  "types-PyYAML",
  "click>=8.1",
]

[tool.uv.workspace]
members = [
  "apps/api",
  "apps/worker",
  "apps/sim-runner",
  "apps/gateway",
  "packages/*",
  "adapters/*",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
  "tests",
  "packages/*/tests",
  "apps/*/tests",
  "adapters/*/tests",
]
addopts = "-q --strict-markers --strict-config --cov=. --cov-report=term-missing:skip-covered --cov-report=xml --cov-config=pyproject.toml"
# Prepend mode requires unique test module basenames repo-wide, because a test dir
# is put on sys.path by name. tests/unit/test_module_layout.py enforces it, and it
# also enforces the rule that shared builders live in a *_support.py module:
# `from conftest import X` resolves to whichever conftest was imported first.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 120
markers = [
  "unit: fast single-module tests",
  "property: hypothesis property-based tests",
  "concurrency: tests against real PostgreSQL in Docker",
  "golden: deterministic scenario/golden comparisons",
  "contract: OpenAPI and event-schema contract tests",
  "security: boundary, secret and threat-model tests",
  "e2e: Playwright end-to-end tests",
  "slow: excluded from the quick local loop",
]
filterwarnings = ["error::DeprecationWarning:droneops_*"]

[tool.coverage.run]
source = ["apps", "packages", "adapters", "tests"]
omit = ["*/__pycache__/*", ".venv/*", "apps/console/*"]

[tool.coverage.report]
skip_empty = true
show_missing = true

# ---------------------------------------------------------------- type checking
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true
mypy_path = [
  "apps/api/src",
  "apps/worker/src",
  "apps/sim-runner/src",
  "apps/gateway/src",
  "packages/airspace/src",
  "packages/conflict-checker/src",
  "packages/contracts/src",
  "packages/core-domain/src",
  "packages/corridor-graph/src",
  "packages/dispatcher/src",
  "packages/energy/src",
  "packages/facilities/src",
  "packages/geom-4d/src",
  "packages/geom-core/src",
  "packages/observability/src",
  "packages/persistence/src",
  "packages/planner/src",
  "packages/platform/src",
  "packages/reservations/src",
  "packages/sim-core/src",
  "packages/telemetry/src",
  "packages/testing-support/src",
  "adapters/airspace-import/src",
  "adapters/gis-etl/src",
  "adapters/terrain/src",
  "adapters/vehicle-mavlink/src",
  "adapters/weather-meteostat/src",
  "adapters/weather-open-meteo/src",
]
files = [
  "apps/api/src",
  "apps/worker/src",
  "apps/sim-runner/src",
  "apps/gateway/src",
  "packages",
  "adapters",
  "scripts",
  "tests",
]
exclude = [
  "^\\.venv/",
  "^apps/console/",
  "^data/",
  "^simulation/reports/",
  "/tests?/",
]

# Adapter boundaries are the only place untyped third-party clients appear.
[[tool.mypy.overrides]]
module = [
  "droneops_adapters_.*",
  "droneops_persistence.*",
  "droneops_observability.*",
  "httpx.*",
  "shapely.*",
  "pyproj.*",
  "geoalchemy2.*",
  "ortools.*",
  "asyncpg.*",
  "alembic.*",
  "structlog.*",
  "redis.*",
  "yaml.*",
  "importlinter.*",
  "schemathesis.*",
  "pytest_asyncio.*",
]
disallow_any_explicit = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
ignore_missing_imports = true

# External SDKs that publish no stubs.
[[tool.mypy.overrides]]
module = ["pymetostat.*", "meteostat.*", "cyclonedx.*", "piplicenses.*"]
ignore_missing_imports = true

# Tests are typed where cheap, but factories and fixtures may use Any.
[[tool.mypy.overrides]]
module = ["tests.*", "conftest"]
disallow_any_explicit = false
disallow_untyped_defs = false

# ------------------------------------------------------------------- lint/format
[tool.ruff]
line-length = 100
target-version = "py312"
indent-width = 4
# Never auto-rewrite from a plain check: `make lint-fix` opts in explicitly.
fix = false
extend-exclude = [
  ".venv",
  "apps/console",
  "data",
  "simulation/reports",
  "contracts/openapi",
]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "UP",   # pyupgrade
  "B",    # bugbear
  "C4",   # comprehensions
  "SIM",  # simplify
  "RET",  # return statements
  "PTH",  # pathlib over os.path
  "ANN",  # annotations (mypy strict is enforced on domain packages)
  "ARG",  # unused arguments
  "N",    # naming
  "PL",   # pylint
  "TRY",  # exception context
  "RUF",  # ruff-specific
  "PT",   # pytest style
]
ignore = [
  "ANN401",  # Any is allowed at explicitly marked adapter boundaries
  "TRY003",  # long messages outside the exception class
  "TRY002",
  "TRY004",
  "PLR0913", # many arguments: factories and kernels legitimately take them
  "PLR2004", # magic values are experiment parameters in this repo
  "SIM108",
  "RUF022", # __all__ is grouped constants/types/functions; ordering is tested per group
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "PLR2004", "ARG", "B011", "S"]
"packages/*/tests/*" = ["ANN", "PLR2004", "ARG"]
"apps/*/tests/*" = ["ANN", "PLR2004", "ARG"]
"adapters/*/*" = ["ANN", "TRY", "PL"]
"scripts/*" = ["ANN", "TRY", "PTH"]
"*/__init__.py" = ["F401", "I001"]
"conftest.py" = ["ANN"]

[tool.ruff.lint.isort]
known-first-party = [
  "droneops_api",
  "droneops_worker",
  "droneops_sim_runner",
  "droneops_gateway",
  "droneops_airspace",
  "droneops_conflict_checker",
  "droneops_contracts",
  "droneops_core_domain",
  "droneops_corridor_graph",
  "droneops_dispatcher",
  "droneops_energy",
  "droneops_facilities",
  "droneops_geom_4d",
  "droneops_geom_core",
  "droneops_observability",
  "droneops_persistence",
  "droneops_planner",
  "droneops_platform",
  "droneops_reservations",
  "droneops_sim_core",
  "droneops_telemetry",
  "droneops_testing_support",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = false

[tool.ruff.lint.flake8-annotations]
suppress-none-returning = true
