[project]
name = "droneops-reservations"
version = "0.1.0"
description = "DroneOps reservation commit state and atomic resource semantics"
requires-python = ">=3.12,<3.14"
dependencies = [
  "asyncpg>=0.30",
  "pydantic>=2.0",
  "droneops-contracts",
  "droneops-core-domain",
  "droneops-geom-core",
  "droneops-platform",
  "droneops-conflict-checker",
]

[build-system]
requires = ["uv_build>=0.11,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
# One import root, as ``technical-build/02-repository-layout.md`` section 4 specifies: the
# SQL half of the ledger is the ``droneops_reservations.ledger`` subpackage. ``.importlinter``'s
# ``domain-is-pure`` contract forbids fastapi, sqlalchemy, httpx and droneops_persistence from
# ``droneops_reservations`` - not asyncpg - so the database half staying inside the package is
# what the contracts actually require, and it keeps the boundary guards covering the ledger too.
module-paths = ["src/droneops_reservations"]

[tool.uv.sources]
droneops-contracts = { workspace = true }
droneops-core-domain = { workspace = true }
droneops-geom-core = { workspace = true }
droneops-platform = { workspace = true }
droneops-conflict-checker = { workspace = true }
