[project]
name = "droneops-persistence"
version = "0.1.0"
description = "DroneOps SQLAlchemy models, repositories and Alembic migrations"
requires-python = ">=3.12,<3.14"
dependencies = [
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.14",
  "asyncpg>=0.30",
  "geoalchemy2>=0.16",
  "pydantic>=2.0",
  "droneops-contracts",
  "droneops-core-domain",
  "droneops-reservations",
  "droneops-telemetry",
  "droneops-platform",
]

[build-system]
requires = ["uv_build>=0.11,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "droneops_persistence"

[tool.uv.sources]
droneops-contracts = { workspace = true }
droneops-core-domain = { workspace = true }
droneops-platform = { workspace = true }
droneops-reservations = { workspace = true }
droneops-telemetry = { workspace = true }
