[project]
name = "droneops-gateway"
version = "0.1.0"
description = "Phase 5 placeholder for a strictly read-only vehicle telemetry gateway"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pydantic>=2.0",
  "structlog>=24.4",
  "droneops-telemetry",
  "droneops-contracts",
  "droneops-observability",
]

[build-system]
requires = ["uv_build>=0.11,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "droneops_gateway"

[tool.uv.sources]
droneops-contracts = { workspace = true }
droneops-observability = { workspace = true }
droneops-telemetry = { workspace = true }
