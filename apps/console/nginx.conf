server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Every response carries the simulation-only boundary in the transport layer too.
    add_header X-Droneops-Phase "phase-0-simulation" always;
    add_header X-Droneops-Authorized-For-Flight "false" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /health {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        access_log off;
    }

    location /version {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # Read-only operator surface. There is no vehicle command route to proxy to,
    # because none exists anywhere in this repository.
    location /v1 {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location /assets {
        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
