# Alembic configuration for the DroneOps persistence layer.
#
# The URL is never stored here. `migrations/env.py` resolves it from
# DRONEOPS_DATABASE_URL / DATABASE_URL (which `.env` pins to the local PostGIS container
# on 127.0.0.1:55432) and refuses to run with no URL at all, so a stray `alembic upgrade`
# can never aim destructive DDL at whatever server happens to own port 5432.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/src
version_path_separator = os
version_locations = %(here)s/migrations/versions

# Filled in by env.py from the environment; left empty on purpose.
sqlalchemy.url =

file_template = %%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
