[project]
name = "droneops-telemetry"
version = "0.1.0"
description = "DroneOps telemetry boundary package"
requires-python = ">=3.12,<3.14"
dependencies = ["pydantic>=2.0", "droneops-contracts", "droneops-geom-core", "droneops-platform"]

[build-system]
requires = ["uv_build>=0.11,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "droneops_telemetry"

[tool.uv.sources]
droneops-contracts = { workspace = true }
droneops-geom-core = { workspace = true }
droneops-platform = { workspace = true }