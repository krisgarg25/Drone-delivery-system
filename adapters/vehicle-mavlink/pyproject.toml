[project]
name = "droneops-vehicle-mavlink"
version = "0.1.0"
description = "DroneOps vehicle-mavlink boundary package"
requires-python = ">=3.12,<3.14"
# Deliberately no dependencies: a Phase 5 read-only decoder must not gain a write path
# by inheriting a client library here. Adding any dependency requires an ADR.
dependencies = []

[build-system]
requires = ["uv_build>=0.11,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "droneops_adapters_vehicle_mavlink"

[tool.uv.sources]