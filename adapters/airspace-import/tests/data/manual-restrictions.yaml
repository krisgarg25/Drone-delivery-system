# Example manual restriction snapshot for DroneOps tests and demos.
# Simulation only. Not authorised for flight. Nothing below is an approved, surveyed or
# published aviation datum: the airport coordinate is OpenStreetMap-derived and the zone
# geometry, altitudes and windows are invented for testing.
#
# Schema notes:
#   availability      manual_operator_file | authoritative_feed | no_feed_configured
#   shape             polygon (open rings are closed on import) | circle | buffered_line
#   altitude_reference AGL | AMSL | GROUND | PAD - never UNSPECIFIED, never omitted (I9)
#   ceiling_m: null   means "no published top", not "unlimited because we liked the number"
#   provenance.freshness omitted -> recorded as unknown -> airspace fails closed on purpose
schema_version: 1
source: operator-supplied example file
version: example-2026-10-01-1
availability: manual_operator_file
restrictions:
  - restriction_id: example-red-sector
    kind: red
    label: Synthetic red sector east of the industrial belt
    shape: polygon
    points:
      - [30.73000, 76.80000]
      - [30.73000, 76.82000]
      - [30.75000, 76.82000]
      - [30.75000, 76.80000]
    floor_m: 0
    ceiling_m: 120
    altitude_reference: AGL
    effective_from_utc: "2026-10-01T00:00:00+00:00"
    effective_until_utc: "2026-10-08T00:00:00+00:00"
    provenance:
      source: operator-manual-entry
      retrieved_at_utc: "2026-10-01T09:00:00+00:00"
      expires_at_utc: "2026-10-02T09:00:00+00:00"
      freshness: fresh
  - restriction_id: example-airport-vicinity
    kind: airport_vicinity
    label: Chandigarh aerodrome vicinity buffer (not an official boundary)
    shape: circle
    points:
      - [30.6742097, 76.7895017]
    radius_m: 3000
    floor_m: 0
    ceiling_m: null
    altitude_reference: AGL
    effective_from_utc: "2026-10-01T00:00:00+00:00"
    effective_until_utc: null
    provenance:
      source: OpenStreetMap aeroway point plus an invented buffer radius
      retrieved_at_utc: "2026-09-30T21:45:44+00:00"
      freshness: fresh
  - restriction_id: example-stale-closure
    kind: temporary_closure
    label: Closure reported three days ago and never refreshed
    shape: buffered_line
    points:
      - [30.74000, 76.76000]
      - [30.74500, 76.78000]
    width_m: 200
    floor_m: 0
    ceiling_m: 60
    altitude_reference: AGL
    effective_from_utc: "2026-09-29T00:00:00+00:00"
    effective_until_utc: null
    provenance:
      source: operator-manual-entry
      retrieved_at_utc: "2026-09-28T09:00:00+00:00"
      expires_at_utc: "2026-09-29T09:00:00+00:00"
      freshness: stale
