[project]
name = "droneops-corridor-graph"
version = "0.1.0"
description = "DroneOps directed lane graph and candidate path generation"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=1.26",
  "droneops-geom-core",
  "droneops-contracts",
  "droneops-airspace",
]

[build-system]
requires = ["uv_build>=0.11,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "droneops_corridor_graph"

[tool.uv.sources]
droneops-airspace = { workspace = true }
droneops-contracts = { workspace = true }
droneops-geom-core = { workspace = true }
