title: Chandigarh synthetic corridor contention, two aircraft, three departures
human_expectation: >-
  Every committed mission holds a protected corridor volume that no other committed
  mission overlaps, no mission is accepted without its energy reserve, and every rejected
  request is counted rather than dropped.
what_this_does_not_prove: >-
  Nothing about real Chandigarh airspace, aircraft performance, weather or certification.
  Geometry is synthetic and obstacle heights in the wider dataset require survey.
