[project]
name = "droneops-terrain"
version = "0.1.0"
description = "DroneOps adapter: DEM clipping and datum handling"
requires-python = ">=3.12,<3.14"
dependencies = [
  "httpx>=0.28",
  "shapely>=2.0",
  "numpy>=1.26",
  "pyproj>=3.6",
  "tenacity>=9.0",
  "droneops-contracts",
  "droneops-geom-core",
]

[build-system]
requires = ["uv_build>=0.11,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "droneops_adapters_terrain"

[tool.uv.sources]
droneops-contracts = { workspace = true }
droneops-geom-core = { workspace = true }
